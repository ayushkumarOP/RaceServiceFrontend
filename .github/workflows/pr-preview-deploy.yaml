name: PR Preview Deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_ENV=preview \
            --build-arg VITE_GATEWAY_URL="$VITE_GATEWAY_URL" \
            -t "$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: docker push "$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}"

      - name: Deploy preview service
        env:
          PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}-pr-${{ inputs.pr_number }}
        run: |
          gcloud run deploy "$PREVIEW_SERVICE" \
            --project "$PROJECT_ID" \
            --image "$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE:${GITHUB_SHA}" \
            --region "$REGION" \
            --platform managed \
            --port 80 \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT"

      - name: Get preview URL
        id: preview-url
        env:
          PREVIEW_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}-pr-${{ inputs.pr_number }}
        run: |
          URL=$(gcloud run services describe "$PREVIEW_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Health check
        env:
          URL: ${{ steps.preview-url.outputs.url }}
        run: |
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            if [ "$STATUS" = "200" ]; then
              echo "Preview deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Preview deployment unhealthy"
          exit 1
