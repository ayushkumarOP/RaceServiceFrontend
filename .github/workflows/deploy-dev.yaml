# Build and deploy Docker image for the Development environment
# Triggered on push to any branch except main

name: Deploy to Dev

on:
  push:
    branches-ignore:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy Docker Image to Dev
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/raceservice-frontend
      IMAGE_TAG: dev-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_ENV=development
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:dev-latest

      - name: Output image info
        run: |
          echo "🚀 Dev image built and pushed successfully!"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"


